name: Update visual snapshots

on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start demo application
        run: npm run demo:start

      - name: Wait for demo application
        run: npx wait-on http://localhost:5173 http://localhost:4000/api/products

      - name: Update visual snapshots
        run: npx playwright test tests/visual --update-snapshots

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/visual
          git diff --cached --quiet || git commit -m "test: update Linux visual snapshots"
          git push